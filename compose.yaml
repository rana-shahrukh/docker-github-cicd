services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: docker-github-cicd:1.0
    container_name: docker-github-cicd-api
    ports:
      - "5050:5050"
    environment:
      PORT: 5050
      MONGO_URI: mongodb://mongo:27017/notesdb
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:8
    container_name: docker-github-cicd-mongo
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
